name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app (ad-hoc signed)
        run: |
          xcodebuild -project ShotMark.xcodeproj -target ShotMark -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO

      - name: Create DMG
        run: |
          mkdir -p dmg
          cp -R build/Release/ShotMark.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname ShotMark -srcfolder dmg -ov -format UDZO ShotMark.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ShotMark-dmg
          path: ShotMark.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ShotMark.dmg --title "ShotMark $GITHUB_REF_NAME" --generate-notes
