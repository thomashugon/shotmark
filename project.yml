name: ShotMark
options:
  bundleIdPrefix: com.thomashugon
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ShotMark:
    type: application
    platform: macOS
    sources: [ShotMark]
    info:
      path: ShotMark/Info.plist
      properties:
        CFBundleDisplayName: ShotMark
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Thomas Hugon"
    entitlements:
      path: ShotMark/ShotMark.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomashugon.ShotMark
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
